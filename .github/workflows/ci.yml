name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy src

      - name: Tests with coverage gate
        run: pytest -q --cov=recsys --cov-report=term --cov-fail-under=60

  docker-smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ctr-deepfm:ci .

      - name: Start container
        run: docker run -d --name ctr-deepfm -p 8000:7860 ctr-deepfm:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs ctr-deepfm
          exit 1

      - name: Smoke test recommendation
        run: |
          curl -sf -X POST http://127.0.0.1:8000/recommend \
            -H "Content-Type: application/json" \
            -d '{"user_id": 1, "top_k": 3}' | tee /tmp/response.json
          grep -q '"items"' /tmp/response.json
          curl -sf http://127.0.0.1:8000/metrics | grep -q recsys_http_requests_total

      - name: Container logs
        if: always()
        run: docker logs ctr-deepfm
